name: Insert UFC 329 card into prod DB

# One-click runner for scripts/insert-card-2026-07-11-ufc329-pg.js (merged in
# #60). Exists because Railway deploys are stalled (prod is a 2026-05-10
# build), so the normal deploy → import-seed path can't deliver tonight's
# card; this inserts it straight into the production Postgres.
#
# Setup: add the app's production DATABASE_URL (Railway → Postgres →
# DATABASE_PUBLIC_URL) as the DATABASE_URL repository secret, then run this
# workflow from the Actions tab. The script is idempotent — safe to re-run.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, write nothing)'
        type: boolean
        default: false
  # Explicitly user-authorized (2026-07-12): also run on PRs touching this
  # file, so the insert can be triggered by pushing a commit — the
  # maintenance credential cannot use workflow_dispatch. Same-repo PRs get
  # repository secrets; the guard step still fails with setup instructions
  # when DATABASE_URL is absent.
  pull_request:
    paths:
      - '.github/workflows/insert-ufc329.yml'

permissions:
  contents: read

concurrency:
  group: insert-ufc329
  cancel-in-progress: false

jobs:
  insert:
    name: Run insert script against prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret not set. Add the Railway DATABASE_PUBLIC_URL value as a repository secret named DATABASE_URL (Settings → Secrets and variables → Actions), then re-run."
            exit 1
          fi
          echo "DATABASE_URL secret present."

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Diagnose connection user + privileges
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "
          const u = new URL(process.env.DATABASE_URL);
          console.log('secret parses as -> user:', u.username, '| host:', u.hostname, '| port:', u.port, '| db:', u.pathname);
          const { Pool } = require('pg');
          const pool = new Pool({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
          (async () => {
            const who = await pool.query('SELECT current_user, current_database()');
            console.log('connected as:', JSON.stringify(who.rows[0]));
            const priv = await pool.query(\"SELECT has_table_privilege(current_user,'fighters','INSERT') AS can_insert_fighters, has_table_privilege(current_user,'events','INSERT') AS can_insert_events, has_table_privilege(current_user,'fights','INSERT') AS can_insert_fights\");
            console.log('privileges:', JSON.stringify(priv.rows[0]));
            const own = await pool.query(\"SELECT tablename, tableowner FROM pg_tables WHERE tablename IN ('fighters','events','fights')\");
            console.log('table owners:', JSON.stringify(own.rows));
            await pool.end();
          })().catch(e => { console.error(e.message); process.exit(1); });
          "

      - name: Insert card
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/insert-card-2026-07-11-ufc329-pg.js --dry-run
          else
            node scripts/insert-card-2026-07-11-ufc329-pg.js
          fi
