name: Deploy · Version Bump + Railway

on:
  push:
    branches: [main]
    # Note: we intentionally do NOT use paths-ignore for package.json/lock.
    # The [skip-version] guard in the version-bump job already prevents the
    # auto-bump loop, and ignoring package.json blocks deploys for any
    # human commit that legitimately edits it (e.g. dep bumps, engines pin).

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  version-bump:
    name: Bump Version (PR)
    runs-on: ubuntu-latest
    # Skip when the SUBJECT (first line of the squash commit) starts with
    # the [skip-version] token — i.e. this is the bot's own release PR
    # landing back on main. We use startsWith on the message rather than
    # contains() because the squash commit's body is the PR description,
    # which can legitimately quote '[skip-version]' in code examples and
    # would falsely match contains(). See PR #24 for the regression that
    # motivated this.
    if: "!startsWith(github.event.head_commit.message, '[skip-version]')"
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}

    steps:
      - name: Wait for CI Quality Gates to pass on this sha
        # CI runs on the same `push: main` trigger as this workflow. Poll the
        # check-suite for this sha until it completes — abort if it failed.
        # We still poll here even though main only takes PR-merged commits;
        # belt-and-suspenders if a fast-forward of an old branch ever lands.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            CONCLUSIONS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name=="Quality & Security" or .name=="Playwright E2E") | {name, status, conclusion}]')
            DONE=$(echo "$CONCLUSIONS" | python -c "import sys,json; r=json.load(sys.stdin); print('yes' if r and all(c['status']=='completed' for c in r) else 'no')")
            if [ "$DONE" = "yes" ]; then
              FAILED=$(echo "$CONCLUSIONS" | python -c "import sys,json; r=json.load(sys.stdin); print('yes' if any(c['conclusion'] not in ('success','skipped','neutral') for c in r) else 'no')")
              if [ "$FAILED" = "yes" ]; then
                echo "::error::CI Quality Gates failed for sha ${SHA} — refusing to bump version"
                echo "$CONCLUSIONS"
                exit 1
              fi
              echo "CI passed for ${SHA}: $CONCLUSIONS"
              exit 0
            fi
            echo "CI still running for ${SHA} (attempt $i/60)…"
            sleep 20
          done
          echo "::error::CI did not complete within 20 minutes for ${SHA}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Determine version bump type
        id: bump_type
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        # Anchor on Conventional Commits semantics:
        #   major: trailer "BREAKING CHANGE:" or `!` after type/scope
        #   minor: subject starts with "feat:" or "feat(scope):"
        #   patch: anything else
        run: |
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n1)
          if printf '%s' "$COMMIT_MSG" | grep -qE '^BREAKING CHANGE:' \
             || printf '%s' "$SUBJECT" | grep -qE '^[a-zA-Z]+(\([^)]+\))?!:'; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif printf '%s' "$SUBJECT" | grep -qE '^feat(\([^)]+\))?:'; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        id: bump
        run: |
          BUMP_TYPE=${{ steps.bump_type.outputs.type }}
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping $CURRENT → $NEW_VERSION ($BUMP_TYPE)"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update package.json
          node -e "
            const pkg = require('./package.json');
            pkg.version = '$NEW_VERSION';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Update package-lock.json if it exists
          if [ -f package-lock.json ]; then
            node -e "
              const lock = require('./package-lock.json');
              lock.version = '$NEW_VERSION';
              if (lock.packages && lock.packages['']) lock.packages[''].version = '$NEW_VERSION';
              require('fs').writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
            "
          fi

      - name: Open release PR
        # Push the bumped package.json + package-lock.json to a release/vX.Y.Z
        # branch and open a PR. Auto-merge keeps the human flow unchanged
        # (the bot's PR squash-merges the second its required checks pass);
        # the tag + GitHub Release job fires on the squashed commit landing
        # on main via the [skip-version] subject.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          SOURCE_SUBJECT: ${{ github.event.head_commit.message }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH="release/v${NEW_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Idempotent against repeat runs (if a prior run created the branch
          # but failed before the PR opened): delete and recreate.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Stale branch $BRANCH on remote — recreating"
            git push origin ":refs/heads/${BRANCH}" || true
          fi
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          # Token order matters — [skip-version] must be at the START of
          # the subject so deploy.yml's startsWith() check on the squash
          # commit message matches reliably. The [skip-e2e] token tells
          # the e2e selector that this mechanical version-string change
          # doesn't need the full Playwright suite. Quality gates still
          # run on the bot PR.
          git commit -m "[skip-version] [skip-e2e] v${NEW_VERSION}" --no-verify
          git push -u origin "$BRANCH"

          # Body is a HEREDOC so newlines + special chars survive.
          BODY=$(cat <<EOF
          Automated version bump for $(printf '%s' "$SOURCE_SUBJECT" | head -n1)

          Source commit: ${SOURCE_SHA}
          Bump type: ${{ steps.bump_type.outputs.type }}

          Auto-merges once required checks pass. The tag and GitHub Release
          land on the squash commit via the tag-and-release job.
          EOF
          )
          # No --label here: 'gh pr create --label' fails the whole step
          # if any of the labels don't exist on the repo, and we don't
          # want a missing-label config to break the deploy cycle. The
          # PR title (and the branch name release/vX.Y.Z) are enough to
          # identify automated bumps in the UI.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "[skip-version] [skip-e2e] v${NEW_VERSION}" \
            --body "$BODY"
          gh pr merge "$BRANCH" --auto --squash --delete-branch

  tag-and-release:
    name: Tag + GitHub Release
    runs-on: ubuntu-latest
    # Fires on the bot PR's squash-merge commit landing on main. The
    # bot's PR title starts with [skip-version], so the squash subject
    # (first line of the commit message) does too. Using startsWith on
    # the message — not contains() — avoids false matches from human
    # PR bodies that happen to quote the token in documentation.
    if: "startsWith(github.event.head_commit.message, '[skip-version]')"
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Read version from package.json
        id: ver
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Read version: ${VERSION}"

      - name: Create + push tag
        env:
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${NEW_VERSION} already exists locally — recreating"
            git tag -d "v${NEW_VERSION}"
          fi
          # If the tag already exists on the remote (e.g. partial prior run),
          # delete it so we can re-point at the squash commit.
          git push origin ":refs/tags/v${NEW_VERSION}" 2>/dev/null || true
          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body: |
            Automated release from commit ${{ github.sha }}

            **Commit:** ${{ github.event.head_commit.message }}

            **Deploy:** Railway auto-deploys from main branch.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Railway deploys automatically via GitHub integration — no action needed.
  # This job just verifies the deployment happened. Runs only on the
  # [skip-version] squash-merge that tag-and-release also keys off, so
  # we know the package.json version matches what Railway should serve.
  verify-deploy:
    name: Verify Railway Deploy
    runs-on: ubuntu-latest
    needs: tag-and-release
    if: always() && needs.tag-and-release.result == 'success'
    timeout-minutes: 20
    # Must NOT fail the workflow run: Railway's "wait for CI" skips the
    # deploy whenever any check suite on the commit fails, and this job
    # fails exactly when prod hasn't deployed yet — a post-deploy verifier
    # gating its own deploy. That circular skip froze prod at v4.27.2 from
    # 2026-05-10 to 2026-08-09. The job still shows red + error annotations
    # when prod lags; it just can't veto the deploy it is waiting for.
    continue-on-error: true
    env:
      RAILWAY_WEB_URL: ${{ secrets.RAILWAY_WEB_URL }}
      RAILWAY_PREDICTIONS_URL: ${{ secrets.RAILWAY_PREDICTIONS_URL }}
      PREDICTION_SERVICE_KEY: ${{ secrets.PREDICTION_SERVICE_KEY }}
      RUN_LIVE_PREDICTION_TRIGGERS: ${{ vars.RUN_LIVE_PREDICTION_TRIGGERS }}
    steps:
      - name: Check deploy-verification secrets
        id: check_secrets
        # Missing Railway secrets → skip verification gracefully (warning, not
        # failure). Setting the secrets later will re-enable verification.
        run: |
          set -u
          MISSING=0
          for var in RAILWAY_WEB_URL RAILWAY_PREDICTIONS_URL PREDICTION_SERVICE_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::warning::$var is not set — skipping deploy verification"
              MISSING=1
            fi
          done
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ "$MISSING" -eq 1 ]; then
            echo "Deploy verification skipped — Railway secrets not configured."
          fi

      # Hardcoded public-URL safety net: poll /api/version against the
      # known prod hostname and fail the workflow if the deployed version
      # doesn't match what tag-and-release tagged. Runs even when Railway
      # secrets are missing, so future deploy regressions can't silently
      # sit on prod for days.
      - name: Verify prod is on the new version (public URL)
        if: needs.tag-and-release.outputs.version != ''
        env:
          NEW_VERSION: ${{ needs.tag-and-release.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://web-production-96d6e.up.railway.app/api/version"
          echo "Expecting version=${NEW_VERSION} at ${URL}"
          for i in $(seq 1 30); do
            BODY=$(curl -s --max-time 10 "$URL" || true)
            # Extract "version":"X.Y.Z" via grep — keeps the YAML scalar
            # block free of multi-line Python.
            DEPLOYED=$(printf '%s' "$BODY" | grep -oE '"version":"[^"]+"' | head -1 | sed -E 's/.*:"([^"]+)"/\1/')
            if [ "$DEPLOYED" = "$NEW_VERSION" ]; then
              echo "Prod on $DEPLOYED (matches $NEW_VERSION) after $i polls"
              exit 0
            fi
            echo "Attempt $i/30 — deployed=${DEPLOYED:-?} expected=$NEW_VERSION"
            sleep 20
          done
          echo "::error::Prod did not reach $NEW_VERSION within 10 minutes — Railway deploy likely failed. Last body: $BODY"
          exit 1

      - name: Wait for web + predictions health
        if: steps.check_secrets.outputs.missing == '0'
        run: |
          set -euo pipefail
          check_health() {
            local url="$1"
            local name="$2"
            local ok=0
            for i in $(seq 1 36); do
              code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$url/healthz" || true)
              if [ "$code" = "200" ]; then
                ok=1
                echo "$name healthy on attempt $i"
                break
              fi
              echo "$name not ready yet (attempt $i/36, status=$code)"
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::$name failed health check at $url/healthz"
              exit 1
            fi
          }
          check_health "$RAILWAY_WEB_URL" "web"
          check_health "$RAILWAY_PREDICTIONS_URL" "predictions"

      - name: Verify predictions contract
        if: steps.check_secrets.outputs.missing == '0'
        run: |
          set -euo pipefail

          HEALTH=$(curl -s "$RAILWAY_PREDICTIONS_URL/healthz")
          echo "$HEALTH" | node -e "
            let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => {
              const j = JSON.parse(d);
              if (!j.status || j.status !== 'ok') process.exit(1);
              if (!Object.prototype.hasOwnProperty.call(j, 'scheduler_running')) process.exit(1);
              if (!Object.prototype.hasOwnProperty.call(j, 'deployment_mode')) process.exit(1);
              console.log('predictions health contract OK');
            });
          "

      - name: Verify authenticated prediction triggers
        if: steps.check_secrets.outputs.missing == '0' && env.RUN_LIVE_PREDICTION_TRIGGERS == 'true'
        run: |
          set -euo pipefail
          for route in retrain predict; do
            code=$(curl -s -o /tmp/${route}.json -w "%{http_code}" \
              -X POST "$RAILWAY_PREDICTIONS_URL/trigger/$route" \
              -H "x-prediction-key: $PREDICTION_SERVICE_KEY" \
              -H "Content-Type: application/json")
            if [ "$code" != "200" ]; then
              echo "::error::/trigger/$route failed with HTTP $code"
              cat /tmp/${route}.json || true
              exit 1
            fi
          done
          echo "predictions trigger endpoints OK"

      - name: Verify main app predictions endpoint
        if: steps.check_secrets.outputs.missing == '0'
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/upcoming.json -w "%{http_code}" \
            "$RAILWAY_WEB_URL/api/predictions?upcoming=1&limit=10")
          if [ "$code" != "200" ]; then
            echo "::error::main app /api/predictions failed (HTTP $code)"
            exit 1
          fi
          cat /tmp/upcoming.json | node -e "
            let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => {
              const j = JSON.parse(d);
              if (!Array.isArray(j)) process.exit(1);
              console.log('main app predictions contract OK; rows=' + j.length);
            });
          "
